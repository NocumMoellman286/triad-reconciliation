[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triad-reconciliation"
version = "0.4.2"
description = "Temporal vision-language reconciliation of optic disc images and visual fields"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "black>=24.0", "isort>=5.13", "mypy>=1.11"]

[project.scripts]
triad-train = "triad_reconciliation.cli.train:main"
triad-evaluate = "triad_reconciliation.cli.evaluate:main"
triad-tables = "triad_reconciliation.cli.tables:main"
triad-verify = "triad_reconciliation.cli.verify:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["build", "dist", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "SIM", "RET", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
combine_as_imports = true
force_sort_within_sections = false
known_first_party = ["triad_reconciliation"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/triad_reconciliation"]
exclude = ["tests/", "scripts/"]
warn_unused_ignores = true
show_error_codes = true
